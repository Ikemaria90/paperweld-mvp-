    <script>
        function setTreatment(treatmentName, btnElement) {
            document.getElementById('treatment').value = treatmentName;
            
            const pills = document.querySelectorAll('.pill-btn');
            pills.forEach(p => p.classList.remove('active'));
            btnElement.classList.add('active');
        }

        async function generateChecklist() {
            const state = document.getElementById('state').value;
            const treatment = document.getElementById('treatment').value || 'Aesthetics';
            
            const pdfContent = document.getElementById('pdf-content');
            const exportSection = document.getElementById('export-section');
            const resultTitle = document.getElementById('result-title');
            const tableBody = document.getElementById('result-table-body');
            const reportMeta = document.getElementById('report-meta');
            
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 20px;">Generating AI compliance audit requirements for ${state}...</td></tr>`;
            pdfContent.style.display = 'block';
            exportSection.style.display = 'block';

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state, treatment })
                });
                
                const data = await res.json();
                const requirements = data.requirements || [];

                const currentDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                reportMeta.innerText = `Generated: ${currentDate} | Jurisdiction: ${state}`;
                resultTitle.innerText = `Compliance Audit Checklist: ${treatment} Practices in ${state}`;
                
                let rowsHTML = '';
                requirements.forEach((req, index) => {
                    let riskClass = 'risk-operational';
                    let riskText = req.risk || 'Operational';
                    if (riskText.toLowerCase().includes('critical')) {
                        riskClass = 'risk-critical';
                        riskText = 'Critical';
                    } else if (riskText.toLowerCase().includes('best')) {
                        riskClass = 'risk-best-practice';
                        riskText = 'Best Practice';
                    }

                    rowsHTML += `
                        <tr>
                            <td style="text-align: center; font-weight: 600; color: #57606a;">AI-${index + 1}</td>
                            <td><strong>${req.item}</strong>: ${req.description}</td>
                            <td style="text-align: center; vertical-align: middle;">
                                <span class="risk-badge ${riskClass}">${riskText}</span><br><br>
                                <button type="button" class="status-action-btn pending" style="background-color: #57606a; color: white; border: none; padding: 8px 14px; font-size: 0.75rem; font-weight: 700; border-radius: 4px; cursor: pointer; text-transform: uppercase; width: 100%;">Pending</button>
                            </td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = rowsHTML;
                updateProgress();

            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: red; padding: 20px;">Error communicating with AI service.</td></tr>`;
            }
        }

        // Use Event Delegation on the Table Body for absolute mobile responsiveness
        document.addEventListener('click', function(event) {
            if (event.target && event.target.classList.contains('status-action-btn')) {
                const button = event.target;
                if (button.classList.contains('pending')) {
                    button.classList.remove('pending');
                    button.classList.add('compliant');
                    button.innerText = '✓ Compliant';
                    button.style.backgroundColor = '#238636';
                } else {
                    button.classList.remove('compliant');
                    button.classList.add('pending');
                    button.innerText = 'Pending';
                    button.style.backgroundColor = '#57606a';
                }
                updateProgress();
            }
        });

        function updateProgress() {
            const buttons = document.querySelectorAll('.status-action-btn');
            const total = buttons.length;
            if (total === 0) return;

            let completed = 0;
            buttons.forEach(btn => {
                if (btn.classList.contains('compliant')) {
                    completed++;
                }
            });

            const percentage = Math.round((completed / total) * 100);
            document.getElementById('progress-percentage').innerText = `${percentage}% Compliant`;
            document.getElementById('progress-fill').style.width = `${percentage}%`;
        }

        function saveReport() {
            const email = document.getElementById('user-email').value;
            const state = document.getElementById('state').value;
            const treatment = document.getElementById('treatment').value || 'Aesthetics';
            const button = document.getElementById('submit-btn');
            const tableRows = document.querySelectorAll('#result-table-body tr');
            const scoreText = document.getElementById('progress-percentage').innerText;
            
            if(!email) {
                alert('Please enter a valid work email first.');
                return;
            }

            let reportText = `State: ${state}\nTreatment: ${treatment}\nAudit Readiness Score: ${scoreText}\n\nRequirements & Status:\n`;
            tableRows.forEach(row => {
                if(row.cells.length > 1) {
                    const text = row.cells[1].innerText;
                    const statusBtn = row.cells[2].querySelector('button');
                    const status = statusBtn ? statusBtn.innerText.replace('✓ ', '') : 'Pending';
                    reportText += `- [${status}] ${text}\n`;
                }
            });

            const originalText = button.innerText;
            button.innerText = 'Sending...';
            button.disabled = true;

            fetch('https://formspree.io/f/myeyyzpz', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    message: reportText,
                    source: 'Interactive Compliance Audit Report'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert(`Success! Audit report submitted by ${email}.`);
                    document.getElementById('user-email').value = '';
                } else {
                    alert('Oops! There was a problem sending the report.');
                }
            })
            .catch(error => {
                alert('Network error. Please try again.');
            })
            .finally(() => {
                button.innerText = originalText;
                button.disabled = false;
            });
        }

        function submitEarlyAccess() {
            const email = document.getElementById('early-email').value;
            const button = document.getElementById('access-btn');
            
            if(!email) {
                alert('Please enter a valid work email first.');
                return;
            }

            const originalText = button.innerText;
            button.innerText = 'Submitting...';
            button.disabled = true;

            fetch('https://formspree.io/f/myeyyzpz', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    source: 'Early Access Waitlist Signup'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert(`Success! ${email} has been added to the Paperweld early access waitlist.`);
                    document.getElementById('early-email').value = '';
                } else {
                    alert('Oops! There was a problem submitting your request.');
                }
            })
            .catch(error => {
                alert('Network error. Please try again.');
            })
            .finally(() => {
                button.innerText = originalText;
                button.disabled = false;
            });
        }
    </script>
