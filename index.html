<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperweld | Medical Spa Compliance & Audit Readiness</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --input-bg: #0d1117;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-primary);
            max-width: 680px; 
            margin: 40px auto; 
            padding: 24px; 
            line-height: 1.5; 
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-container img {
            max-width: 160px;
            height: auto;
            border-radius: 8px;
        }
        h1 { font-size: 1.8rem; margin-top: 0; margin-bottom: 8px; letter-spacing: -0.5px; text-align: center; }
        .tagline { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 28px; text-align: center; }
        h3 { font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 28px; margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        select, input { 
            padding: 12px; 
            width: 100%; 
            font-size: 1rem; 
            margin-bottom: 20px; 
            background-color: var(--input-bg);
            border: 1px solid var(--border-color); 
            color: var(--text-primary);
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        select:focus, input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button { 
            padding: 12px 20px; 
            font-size: 1rem; 
            font-weight: 600;
            background: var(--accent); 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #1a5c27; cursor: not-allowed; }
        .secondary-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
        }
        .secondary-btn:hover {
            background: #30363d;
        }
        
        /* Formal Report Table Styles */
        .checklist { 
            margin-top: 24px; 
            background: #ffffff; 
            color: #000000;
            padding: 24px; 
            border-radius: 8px; 
            border: 1px solid #d0d7de; 
            display: none; 
        }
        .report-header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-bottom: 2px solid #0366d6;
            padding-bottom: 10px;
        }
        .report-header-table td {
            vertical-align: middle;
        }
        .audit-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.95rem;
        }
        .audit-table th, .audit-table td {
            border: 1px solid #d0d7de;
            padding: 10px 14px;
            text-align: left;
        }
        .audit-table th {
            background-color: #f6f8fa;
            color: #24292e;
            font-weight: 600;
        }
        .audit-table td {
            color: #24292e;
            background-color: #ffffff;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #cf222e;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .export-box { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .section-divider { margin: 32px 0 16px 0; border: none; border-top: 1px solid var(--border-color); }

        /* Print-specific rules for clean formal output */
        @media print {
            body { background-color: #ffffff !important; color: #000000 !important; max-width: 100%; margin: 0; padding: 10px; }
            .container { background-color: #ffffff !important; border: none; box-shadow: none; padding: 0; }
            .container > *:not(#pdf-content):not(#export-section) { display: none !important; }
            .export-box button, .export-box label, .export-box input { display: none !important; }
            #pdf-content { display: block !important; background-color: #ffffff !important; color: #000000 !important; border: none !important; padding: 0 !important; }
            .audit-table th { background-color: #f6f8fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="Paperweld-logo.jpg" alt="Paperweld Logo">
        </div>
        <h1>Paperweld</h1>
        <p class="tagline">Turning the burden of medical spa compliance into clear, trusted practice.</p>
        
        <h3>Generate State Compliance Checklist</h3>
        <label for="state">Select Your State:</label>
        <select id="state">
            <option value="Alabama">Alabama</option>
            <option value="Alaska">Alaska</option>
            <option value="Arizona">Arizona</option>
            <option value="Arkansas">Arkansas</option>
            <option value="California">California</option>
            <option value="Colorado">Colorado</option>
            <option value="Connecticut">Connecticut</option>
            <option value="Delaware">Delaware</option>
            <option value="Florida">Florida</option>
            <option value="Georgia">Georgia</option>
            <option value="Hawaii">Hawaii</option>
            <option value="Idaho">Idaho</option>
            <option value="Illinois">Illinois</option>
            <option value="Indiana">Indiana</option>
            <option value="Iowa">Iowa</option>
            <option value="Kansas">Kansas</option>
            <option value="Kentucky">Kentucky</option>
            <option value="Louisiana">Louisiana</option>
            <option value="Maine">Maine</option>
            <option value="Maryland">Maryland</option>
            <option value="Massachusetts">Massachusetts</option>
            <option value="Michigan">Michigan</option>
            <option value="Minnesota">Minnesota</option>
            <option value="Mississippi">Mississippi</option>
            <option value="Missouri">Missouri</option>
            <option value="Montana">Montana</option>
            <option value="Nebraska">Nebraska</option>
            <option value="Nevada">Nevada</option>
            <option value="New Hampshire">New Hampshire</option>
            <option value="New Jersey">New Jersey</option>
            <option value="New Mexico">New Mexico</option>
            <option value="New York">New York</option>
            <option value="North Carolina">North Carolina</option>
            <option value="North Dakota">North Dakota</option>
            <option value="Ohio">Ohio</option>
            <option value="Oklahoma">Oklahoma</option>
            <option value="Oregon">Oregon</option>
            <option value="Pennsylvania">Pennsylvania</option>
            <option value="Rhode Island">Rhode Island</option>
            <option value="South Carolina">South Carolina</option>
            <option value="South Dakota">South Dakota</option>
            <option value="Tennessee">Tennessee</option>
            <option value="Texas">Texas</option>
            <option value="Utah">Utah</option>
            <option value="Vermont">Vermont</option>
            <option value="Virginia">Virginia</option>
            <option value="Washington">Washington</option>
            <option value="West Virginia">West Virginia</option>
            <option value="Wisconsin">Wisconsin</option>
            <option value="Wyoming">Wyoming</option>
        </select>

        <label for="treatment">Primary Treatment:</label>
        <input type="text" id="treatment" placeholder="e.g., Botox, Laser, Filler, IV Therapy">

        <button onclick="generateChecklist()">Generate Requirements</button>

        <!-- Formal Structured Report Card -->
        <div id="pdf-content" class="checklist">
            <table class="report-header-table">
                <tr>
                    <td>
                        <img src="Paperweld-logo.jpg" alt="Logo" style="max-width: 100px; height: auto; border-radius: 4px;">
                    </td>
                    <td style="text-align: right;">
                        <h3 style="margin: 0; color: #0366d6; border: none; padding: 0;">PAPERWELD COMPLIANCE AUDIT</h3>
                        <p id="report-meta" style="margin: 4px 0 0 0; font-size: 0.85rem; color: #57606a;"></p>
                    </td>
                </tr>
            </table>
            
            <h4 id="result-title" style="margin-top:0; margin-bottom: 12px; color: #24292e; font-size: 1.05rem;"></h4>
            
            <table class="audit-table">
                <thead>
                    <tr>
                        <th style="width: 8%;">Ref</th>
                        <th style="width: 74%;">Regulatory Requirement</th>
                        <th style="width: 18%; text-align: center;">Status / Review</th>
                    </tr>
                </thead>
                <tbody id="result-table-body">
                    <!-- Dynamic Rows Go Here -->
                </tbody>
            </table>
        </div>

        <div id="export-section" style="display: none;">
            <div class="export-box">
                <button onclick="window.print()" class="secondary-btn">📥 Save / Print Formal PDF Report</button>
                <label for="user-email" style="margin-top: 16px;">Save and email this complete audit report:</label>
                <input type="email" id="user-email" placeholder="name@medspa.com">
                <button id="submit-btn" onclick="saveReport()">Email Full Report</button>
            </div>
        </div>

        <hr class="section-divider">

        <h3>Join the Waitlist</h3>
        <label for="early-email">Get notified when full automated platform access opens:</label>
        <input type="email" id="early-email" placeholder="name@medspa.com">
        <button id="access-btn" onclick="submitEarlyAccess()">Request Early Access</button>
    </div>

    <script>
        const generalDefaults = [
            "State Medical Board supervisory agreement verified.",
            "Good Faith Exam (GFE) performed by authorized physician, PA, or NP prior to treatment.",
            "Standardized procedures or standing delegation orders established for provider execution.",
            "Emergency crash kit, reversal medications, and adverse event logs on site."
        ];

        const treatmentAddons = {
            laser: [
                "Physician or authorized provider initial consultation and patient evaluation.",
                "Strict adherence to state laser classification and supervision limits.",
                "Operator competency certification records maintained up to date."
            ],
            filler: [
                "High-risk vascular occlusion management protocol and emergency hyaluronidase supply on hand.",
                "Advanced anatomical injection competency documentation verified."
            ],
            iv: [
                "Compounded nutrient sourcing compliance under strict state pharmacy and board guidelines.",
                "Patient baseline labs and physician sign-off protocol verified for infusion therapy."
            ]
        };

        function generateChecklist() {
            const state = document.getElementById('state').value;
            const treatmentInput = document.getElementById('treatment').value.toLowerCase();
            const treatmentName = document.getElementById('treatment').value || 'Aesthetics';
            
            const pdfContent = document.getElementById('pdf-content');
            const exportSection = document.getElementById('export-section');
            const resultTitle = document.getElementById('result-title');
            const tableBody = document.getElementById('result-table-body');
            const reportMeta = document.getElementById('report-meta');

            let requirements = [...generalDefaults];
            
            if (treatmentInput.includes('laser') || treatmentInput.includes('hair removal') || treatmentInput.includes('light')) {
                requirements = requirements.concat(treatmentAddons.laser);
            }
            if (treatmentInput.includes('filler') || treatmentInput.includes('lip') || treatmentInput.includes('cheek') || treatmentInput.includes('botox') || treatmentInput.includes('neurotoxin')) {
                requirements = requirements.concat(treatmentAddons.filler);
            }
            if (treatmentInput.includes('iv') || treatmentInput.includes('infusion') || treatmentInput.includes('hydration') || treatmentInput.includes('vitamin')) {
                requirements = requirements.concat(treatmentAddons.iv);
            }

            const currentDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            reportMeta.innerText = `Generated: ${currentDate} | Jurisdiction: ${state}`;
            resultTitle.innerText = `Compliance Audit Checklist: ${treatmentName} Practices in ${state}`;
            
            let rowsHTML = '';
            requirements.forEach((req, index) => {
                rowsHTML += `
                    <tr>
                        <td style="text-align: center; font-weight: 600; color: #57606a;">REQ-${index + 1}</td>
                        <td>${req}</td>
                        <td style="text-align: center;"><span class="status-badge">Pending Review</span></td>
                    </tr>
                `;
            });
            tableBody.innerHTML = rowsHTML;
            
            pdfContent.style.display = 'block';
            exportSection.style.display = 'block';
        }

        function saveReport() {
            const email = document.getElementById('user-email').value;
            const state = document.getElementById('state').value;
            const treatment = document.getElementById('treatment').value || 'Aesthetics';
            const button = document.getElementById('submit-btn');
            const tableRows = document.querySelectorAll('#result-table-body tr');
            
            if(!email) {
                alert('Please enter a valid work email first.');
                return;
            }

            let reportText = `State: ${state}\nTreatment: ${treatment}\n\nRequirements:\n`;
            tableRows.forEach(row => {
                const text = row.cells[1].innerText;
                reportText += `- ${text}\n`;
            });

            const originalText = button.innerText;
            button.innerText = 'Sending...';
            button.disabled = true;

            fetch('https://formspree.io/f/myeyyzpz', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    message: reportText,
                    source: 'Formal Compliance Audit Report Generator'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert(`Success! Audit report submitted by ${email}.`);
                    document.getElementById('user-email').value = '';
                } else {
                    alert('Oops! There was a problem sending the report.');
                }
            })
            .catch(error => {
                alert('Network error. Please try again.');
            })
            .finally(() => {
                button.innerText = originalText;
                button.disabled = false;
            });
        }

        function submitEarlyAccess() {
            const email = document.getElementById('early-email').value;
            const button = document.getElementById('access-btn');
            
            if(!email) {
                alert('Please enter a valid work email first.');
                return;
            }

            const originalText = button.innerText;
            button.innerText = 'Submitting...';
            button.disabled = true;

            fetch('https://formspree.io/f/myeyyzpz', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    source: 'Early Access Waitlist Signup'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert(`Success! ${email} has been added to the Paperweld early access waitlist.`);
                    document.getElementById('early-email').value = '';
                } else {
                    alert('Oops! There was a problem submitting your request.');
                }
            })
            .catch(error => {
                alert('Network error. Please try again.');
            })
            .finally(() => {
                button.innerText = originalText;
                button.disabled = false;
            });
        }
    </script>
</body>
</html>
