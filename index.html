<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperweld | Medical Spa Compliance & Audit Readiness</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --input-bg: #0d1117;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-primary);
            max-width: 640px; 
            margin: 40px auto; 
            padding: 24px; 
            line-height: 1.5; 
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.8rem; margin-top: 0; margin-bottom: 8px; letter-spacing: -0.5px; }
        .tagline { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 28px; }
        h3 { font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-top: 24px; margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        select, input { 
            padding: 12px; 
            width: 100%; 
            font-size: 1rem; 
            margin-bottom: 20px; 
            background-color: var(--input-bg);
            border: 1px solid var(--border-color); 
            color: var(--text-primary);
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        select:focus, input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button { 
            padding: 12px 20px; 
            font-size: 1rem; 
            font-weight: 600;
            background: var(--accent); 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        .checklist { 
            margin-top: 24px; 
            background: var(--bg-color); 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            display: none; 
        }
        .checklist ul { padding-left: 20px; margin-bottom: 0; color: var(--text-primary); }
        .checklist li { margin-bottom: 10px; }
        .export-box { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paperweld</h1>
        <p class="tagline">Turning the burden of medical spa compliance into clear, trusted practice.</p>
        
        <h3>Generate State Compliance Checklist</h3>
        <label for="state">Select Your State:</label>
        <select id="state">
            <option value="California">California</option>
            <option value="Texas">Texas</option>
            <option value="Florida">Florida</option>
            <option value="New York">New York</option>
        </select>

        <label for="treatment">Primary Treatment:</label>
        <input type="text" id="treatment" placeholder="e.g., Botox, Laser Hair Removal">

        <button onclick="generateChecklist()">Generate Requirements</button>

        <div id="result" class="checklist">
            <h4 id="result-title" style="margin-top:0; color: #58a6ff;"></h4>
            <ul id="result-list"></ul>
            
            <div class="export-box">
                <label for="user-email">Save and email this complete audit report:</label>
                <input type="email" id="user-email" placeholder="name@medspa.com">
                <button onclick="saveReport()">Email Full Report</button>
            </div>
        </div>
    </div>

    <script>
        function generateChecklist() {
            const state = document.getElementById('state').value;
            const treatment = document.getElementById('treatment').value || 'General Aesthetics';
            
            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('result-title');
            const resultList = document.getElementById('result-list');

            resultTitle.innerText = `Compliance Requirements for ${treatment} in ${state}:`;
            resultList.innerHTML = `
                <li>Medical Director oversight agreement verified for ${state}.</li>
                <li>Good Faith Exam (GFE) protocol established prior to ${treatment}.</li>
                <li>State board licensed practitioner requirement confirmed.</li>
                <li>Emergency equipment and adverse event logs ready for audit.</li>
            `;
            resultDiv.style.display = 'block';
        }

        function saveReport() {
            const email = document.getElementById('user-email').value;
            if(email) {
                alert(`Success! Full audit report sent to ${email}.`);
            } else {
                alert('Please enter a valid work email first.');
            }
        }
    </script>
</body>
</html>
