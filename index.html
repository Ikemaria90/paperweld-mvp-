<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperweld | Medical Spa Compliance & Early Access</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --input-bg: #0d1117;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-primary);
            max-width: 640px; 
            margin: 60px auto; 
            padding: 24px; 
            line-height: 1.5; 
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-align: center;
        }
        .logo-container {
            margin-bottom: 24px;
        }
        .logo-container img {
            max-width: 160px;
            height: auto;
            border-radius: 8px;
        }
        h1 { 
            font-size: 2rem; 
            margin-top: 0; 
            margin-bottom: 12px; 
            letter-spacing: -0.5px; 
        }
        .tagline { 
            color: var(--text-secondary); 
            font-size: 1.15rem; 
            margin-bottom: 32px; 
            line-height: 1.6;
        }
        .early-access-box {
            text-align: left;
            background: var(--bg-color);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        label { 
            display: block; 
            font-size: 0.95rem; 
            font-weight: 500; 
            margin-bottom: 8px; 
            color: var(--text-primary); 
        }
        input { 
            padding: 12px; 
            width: 100%; 
            font-size: 1rem; 
            margin-bottom: 16px; 
            background-color: var(--input-bg);
            border: 1px solid var(--border-color); 
            color: var(--text-primary);
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button { 
            padding: 12px 20px; 
            font-size: 1rem; 
            font-weight: 600;
            background: var(--accent); 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #1a5c27; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="Paperweld-logo.jpg" alt="Paperweld Logo">
        </div>
        <h1>Paperweld</h1>
        <p class="tagline">Turning the burden of medical spa compliance into clear, trusted practice.</p>
        
        <div class="early-access-box">
            <label for="early-email">Get notified when early access opens:</label>
            <input type="email" id="early-email" placeholder="name@medspa.com">
            <button id="access-btn" onclick="submitEarlyAccess()">Request Early Access</button>
        </div>
    </div>

    <script>
        function submitEarlyAccess() {
            const email = document.getElementById('early-email').value;
            const button = document.getElementById('access-btn');
            
            if(!email) {
                alert('Please enter a valid work email first.');
                return;
            }

            const originalText = button.innerText;
            button.innerText = 'Submitting...';
            button.disabled = true;

            // Connected to your active Formspree backend
            fetch('https://formspree.io/f/myeyyzpz', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    source: 'Early Access Landing Page Request'
                })
            })
            .then(response => {
                if (response.ok) {
                    alert(`Success! ${email} has been added to the Paperweld early access waitlist.`);
                    document.getElementById('early-email').value = '';
                } else {
                    alert('Oops! There was a problem submitting your request.');
                }
            })
            .catch(error => {
                alert('Network error. Please try again.');
            })
            .finally(() => {
                button.innerText = originalText;
                button.disabled = false;
            });
        }
    </script>
</body>
</html>
